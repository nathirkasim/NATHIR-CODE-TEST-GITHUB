
name: TigerGate Security Scan

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TigerGate Security Scan
        run: |
          docker run --rm \
            -e TIGERGATE_API_KEY \
            -e GITHUB_TOKEN \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e GITHUB_REPOSITORY \
            -v "$PWD:/workspace" \
            -w /workspace \
            tigergate/tigergate-cli:latest \
            scan \
              --api-url https://api.staging.tigergate.dev/api/ci \
              --type all \
              --scan-scope auto \
              --fail-on critical,high \
              --max-critical 0 \
              --max-high 10 \
              --quality-gate \
              --exclude "node_modules,dist,vendor" \
              --sca-ignore-unfixed \
              --coverage-report coverage/lcov.info \
              --compliance \
              --upload

        env:
          TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
